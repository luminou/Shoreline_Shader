<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>olmShoreline · User manual</title>
<style>
:root{--bg:#16245c;--ink:#f2f5fc;--muted:#aab8e0;--sand:#d8c49a}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.gate{min-height:100vh;display:grid;place-items:center;padding:16px;box-sizing:border-box;background:radial-gradient(120% 90% at 80% 10%,#1c2d6e,#16245c 60%)}
.card{width:100%;max-width:360px;display:grid;gap:14px}
.k{font:600 12px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
h1{margin:0;font-size:26px;line-height:1.15}
p{margin:0;color:var(--muted);font-size:14px}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:10px 12px}
input:focus{outline:2px solid var(--sand);outline-offset:1px}
button{font:600 14px/1 inherit;font-family:inherit;color:#16245c;background:var(--sand);border:0;border-radius:8px;padding:0 16px;cursor:pointer}
.err{color:#ffb4b4;min-height:1.4em}
.bar{height:4px;background:var(--sand);border-radius:2px;width:56px}
</style>
</head><body>
<main class="gate"><div class="card">
  <div class="bar"></div>
  <span class="k">olmShoreline</span>
  <h1>User manual</h1>
  <p>This page is password protected. / Cette page est protégée par un mot de passe.</p>

</div></main>
